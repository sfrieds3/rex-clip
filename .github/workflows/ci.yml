name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: --check lua test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lunarmodules/luacheck@v1
        with:
          args: lua test

  # Releases are versioned from commit messages, and PRs are squash-merged with the
  # PR title as the commit message, so titles must be conventional commits.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tags and releases each push to main that has a feat, fix or breaking commit since the last tag.
  release:
    name: Release
    needs: [format, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(.github/scripts/next-version.sh)
          if [[ -z $version ]]; then
            echo "No feat, fix or breaking commits since the last release; nothing to release."
            exit 0
          fi
          last=$(git tag --merged HEAD --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          git log --format='- %s (%h)' "${last:+$last..}HEAD" > notes.md
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file notes.md
